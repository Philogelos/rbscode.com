<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3. Key Escape</title>

    <style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f7;
    color: #172033;
}
.wrap {
    width: 700px;
    max-width: calc(100% - 24px);
    margin: 24px auto;
}
h1 {
    margin: 0 0 8px;
}
.hud {
    background: white;
    padding: 12px 16px;
    border-radius: 12px 12px 0 0;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
}
.message {
    background: #172033;
    color: white;
    padding: 10px 16px;
    font-weight: bold;
    text-align: center;
}
.game {
    position: relative;
    width: 100%;
    height: 390px;
    overflow: hidden;
    border: 4px solid #172033;
    box-sizing: border-box;
    background: linear-gradient(#dff4ff, #c9f1d2);
}
.sprite {
    position: absolute;
    width: 52px;
    height: 52px;
    font-size: 42px;
    line-height: 52px;
    text-align: center;
    user-select: none;
}
.big {
    width: 68px;
    height: 68px;
    font-size: 54px;
    line-height: 68px;
}
button {
    margin-top: 12px;
    padding: 10px 15px;
    border: 0;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
}


    </style>
</head>
<body>

<div class="wrap">
    <h1>3. Key Escape</h1>
    <p>Find the key, avoid the guard, then reach the locked door.</p>

    <div class="hud">
        <span>Mission: get 🔑</span>
        <span>Then reach 🚪</span>
    </div>

    <div id="message" class="message">GO!</div>

    <div id="game" class="game">
        <div id="player" class="sprite" style="left:35px;top:300px">🧑</div>
        <div id="key" class="sprite" style="left:300px;top:70px">🔑</div>
        <div id="door" class="sprite big" style="left:585px;top:20px">🚪</div>
        <div id="guard" class="sprite" style="left:250px;top:245px">🤖</div>
    </div>

    <button onclick="restartGame()">RESTART</button>
</div>

<!-- LIBRARIES FIRST -->
<script src="rbs-game-library.js"></script>

<!-- YOUR GAME CODE -->
<script>
moveWithKeys("player", 7, "game");
keyOpensDoor("player", "key", "door", "message");
patrol("guard", 3, 0, "game");
loseOnTouch("player", "guard", "message");
</script>

</body>
</html>
