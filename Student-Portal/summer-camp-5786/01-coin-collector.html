<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>1. Coin Collector</title>

    <style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f7;
    color: #172033;
}
.wrap {
    width: 700px;
    max-width: calc(100% - 24px);
    margin: 24px auto;
}
h1 {
    margin: 0 0 8px;
}
.hud {
    background: white;
    padding: 12px 16px;
    border-radius: 12px 12px 0 0;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
}
.message {
    background: #172033;
    color: white;
    padding: 10px 16px;
    font-weight: bold;
    text-align: center;
}
.game {
    position: relative;
    width: 100%;
    height: 390px;
    overflow: hidden;
    border: 4px solid #172033;
    box-sizing: border-box;
    background: linear-gradient(#dff4ff, #c9f1d2);
}
.sprite {
    position: absolute;
    width: 52px;
    height: 52px;
    font-size: 42px;
    line-height: 52px;
    text-align: center;
    user-select: none;
}
.big {
    width: 68px;
    height: 68px;
    font-size: 54px;
    line-height: 68px;
}
button {
    margin-top: 12px;
    padding: 10px 15px;
    border: 0;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
}


    </style>
</head>
<body>

<div class="wrap">
    <h1>1. Coin Collector</h1>
    <p>Move around and collect 10 coins.</p>

    <div class="hud">
        <span>Coins: <span id="scoreText">0</span></span>
        <span>Goal: 10</span>
    </div>

    <div id="message" class="message">GO!</div>

    <div id="game" class="game">
        <div id="player" class="sprite" style="left:40px;top:160px">😀</div>
        <div id="coin" class="sprite" style="left:540px;top:90px">🪙</div>
    </div>

    <button onclick="restartGame()">RESTART</button>
</div>

<!-- LIBRARIES FIRST -->
<script src="rbs-game-library.js"></script>

<!-- YOUR GAME CODE -->
<script>
moveWithKeys("player", 7, "game");
collect("player", "coin", "scoreText", 1, "game");
winAtScore("scoreText", 10, "message");
</script>

</body>
</html>
